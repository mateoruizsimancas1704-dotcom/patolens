name: Compilar APK e IPA
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Preparar www
        run: |
          mkdir -p www/lib/leaflet assets
          cp *.html *.css *.js *.png *.webmanifest www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/lib/leaflet/
          cp -r node_modules/leaflet/dist/images www/lib/leaflet/
          cp icon-1024.png assets/icon-only.png
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff'
        continue-on-error: true
      - name: Permisos
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PatoLens-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=optional --no-audit --no-fund
      - name: Preparar www
        run: |
          mkdir -p www/lib/leaflet
          cp *.html *.css *.js *.png *.webmanifest www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/lib/leaflet/
          cp -r node_modules/leaflet/dist/images www/lib/leaflet/
      - run: npx cap add ios
      - name: Icono y permisos
        run: |
          I=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          if [ -f "$I" ]; then cp icon-1024.png "$I"; else echo "icono por defecto"; fi
          P=ios/App/App/Info.plist
          add() { /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$P"; }
          add NSCameraUsageDescription "PatoLens usa la camara para fotografiar lesiones"
          add NSPhotoLibraryUsageDescription "PatoLens permite elegir fotos y planos"
          add NSLocationWhenInUseUsageDescription "PatoLens registra la ubicacion de la lesion"
      - run: npx cap sync ios
      - name: Compilar sin firmar
        run: |
          set -o pipefail
          cd ios/App
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60
          mkdir Payload && cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr PatoLens.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PatoLens-IPA
          path: ios/App/PatoLens.ipa
